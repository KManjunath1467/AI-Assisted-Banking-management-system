```yaml
openapi: 3.0.3

info:
  title: Transaction History and Reporting API
  version: 1.0.0
  description: API for retrieving and recording account transaction history.

paths:

  /transactions/{accountid}:

    get:
      operationId: getTransactionsByRecipientName
      summary: Retrieve transaction history
      description: >
        Retrieves transaction history for an account.
        Results can optionally be filtered by recipient name.

      parameters:

        - name: accountid
          in: path
          required: true
          description: Identifier of the account.
          schema:
            type: string

        - name: recipient_name
          in: query
          required: false
          description: Name of the recipient used to filter transactions.
          schema:
            type: string

      responses:

        '200':
          description: List of transactions matching the requested criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

    post:
      operationId: notifyTransaction
      summary: Record a banking transaction
      description: Records a banking transaction in the account history.

      parameters:

        - name: accountid
          in: path
          required: true
          description: Identifier of the account associated with the transaction.
          schema:
            type: string

      requestBody:
        required: true
        description: Transaction information to be recorded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'

      responses:

        '200':
          description: Transaction recorded successfully.

        '400':
          description: Invalid transaction request.

        '500':
          description: An unexpected server error occurred.

components:

  schemas:

    Transaction:
      type: object
      description: Represents a banking transaction.

      properties:

        id:
          type: string
          description: Unique identifier for the transaction.

        description:
          type: string
          description: Description containing the reason and other payment details.

        type:
          type: string
          description: Indicates whether the transaction is an income or outcome transaction.

        recipientName:
          type: string
          description: Name of the recipient.

        recipientBankReference:
          type: string
          description: Bank reference associated with the recipient.

        accountId:
          type: string
          description: Identifier of the account associated with the transaction.

        paymentType:
          type: string
          description: Type of payment, such as credit card, bank transfer, or direct debit.

        amount:
          type: string
          description: Amount associated with the transaction.

        timestamp:
          type: string
          format: date-time
          description: Date and time at which the transaction occurred.
```
