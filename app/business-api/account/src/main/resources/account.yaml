openapi: 3.0.3

info:
  title: Account API
  version: 1.0.0
  description: API for retrieving user account, payment method, and beneficiary information.

paths:

  /users/{user_name}/accounts:
    get:
      summary: Retrieve accounts for a user
      description: Returns all accounts associated with the specified user.
      operationId: getAccountsByUserId

      parameters:
        - name: user_name
          in: path
          required: true
          description: Username of the logged-in user.
          schema:
            type: string

      responses:
        '200':
          description: List of accounts associated with the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'

  /accounts/{accountid}:
    get:
      summary: Retrieve account details
      description: Returns account information together with its available payment methods.
      operationId: getAccountDetails

      parameters:
        - name: accountid
          in: path
          required: true
          description: Identifier of the account.
          schema:
            type: string

      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /accounts/{accountid}/paymentmethods/{methodid}:
    get:
      summary: Retrieve payment method details
      description: Returns payment method information and its available balance.
      operationId: getPaymentMethodDetails

      parameters:
        - name: accountid
          in: path
          required: true
          description: Identifier of the account.
          schema:
            type: string

        - name: methodid
          in: path
          required: true
          description: Identifier of the payment method associated with the account.
          schema:
            type: string

      responses:
        '200':
          description: Payment method details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'

  /accounts/{accountid}/registeredBeneficiaries:
    get:
      summary: Retrieve registered beneficiaries
      description: Returns the beneficiaries registered for the specified account.
      operationId: getBeneficiaryMethodDetails

      parameters:
        - name: accountid
          in: path
          required: true
          description: Identifier of the account.
          schema:
            type: string

      responses:
        '200':
          description: List of registered beneficiaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Beneficiary'

components:

  schemas:

    Account:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the account.

        userName:
          type: string
          description: Username associated with the account.

        accountHolderFullName:
          type: string
          description: Full name of the account holder.

        currency:
          type: string
          description: Currency used by the account.

        activationDate:
          type: string
          description: Date on which the account was activated.

        balance:
          type: string
          description: Current account balance.

        paymentMethods:
          type: array
          description: Payment methods associated with the account.
          items:
            $ref: '#/components/schemas/PaymentMethodSummary'

    PaymentMethodSummary:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the payment method.

        type:
          type: string
          description: Type of payment method.

        activationDate:
          type: string
          description: Date on which the payment method was activated.

        expirationDate:
          type: string
          description: Date on which the payment method expires.

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the payment method.

        type:
          type: string
          description: Type of payment method.

        activationDate:
          type: string
          description: Date on which the payment method was activated.

        expirationDate:
          type: string
          description: Date on which the payment method expires.

        availableBalance:
          type: string
          description: Available balance for the payment method.

        cardNumber:
          type: string
          description: Card number associated with the payment method.

    Beneficiary:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the beneficiary.

        fullName:
          type: string
          description: Full name of the beneficiary.

        bankCode:
          type: string
          description: Bank code of the beneficiary's bank.

        bankName:
          type: string
          description: Name of the beneficiary's bank.
```
